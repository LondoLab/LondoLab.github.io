# Temporary: regenerates Gemfile.lock on the update-gems branch, then test-builds the site.
# Delete this file before merging.
name: tmp update lockfile

on:
  push:
    branches: ["update-gems"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Update all gems
        run: |
          bundle lock --remove-platform x64-mingw32 x64-unknown universal-darwin-21 universal-darwin-22 || true
          bundle lock --update
          bundle install
          git diff --stat Gemfile.lock
      - name: Test build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Update gems in Gemfile.lock" || echo "no changes"
          git push
