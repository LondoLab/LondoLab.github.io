<!-- Co-authorship network of publications, built client-side from citations data. -->
<script id="pub-data" type="application/json">{{ site.data.citations | jsonify }}</script>

<div class="pubnet">
  <div class="pubnet-head">
    <p class="pubnet-title">Co-authorship network</p>
    <p class="pubnet-sub">
      Each mark is a paper; papers are linked when they share an author other than Londo.
      Color = research theme, shape = journal (●) vs preprint (◆), size = number of co-authors.
      Hover to inspect, click to open the DOI, drag to rearrange.
    </p>
  </div>

  <div class="pubnet-legend" id="pubnet-legend"></div>

  <div class="pubnet-canvas">
    <svg id="pubnet-svg" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Publication co-authorship network">
      <g id="pubnet-edges" stroke="#cbd5e1" stroke-linecap="round"></g>
      <g id="pubnet-nodes"></g>
    </svg>
    <div class="pubnet-tip" id="pubnet-tip" hidden></div>
  </div>
</div>

<script>
(function () {
  var raw;
  try { raw = JSON.parse(document.getElementById('pub-data').textContent) || []; }
  catch (e) { return; }
  if (!raw.length) return;

  // ---- theme classification (heuristic, priority order) ----
  var THEMES = [
    { key: 'genomics',  label: 'Genomics & evolution',      color: '#7c6bd0',
      re: /genom|pangenom|phylogen|domesticat|sex.?determin|hermaphrodit|recombinat|\bsnp\b|sequencing|population structure|germplasm|cytoplasmic|chloroplast|\bqtl\b|ampseq|marker/i },
    { key: 'cold',      label: 'Cold hardiness & dormancy',  color: '#2c7fb8',
      re: /cold.?hard|deacclimat|acclimat|dormanc|freez|chill|supercool|budbreak|\bwinter\b|hardiness|frost|cryoprotect|\bcbf\b|low.?temperature/i },
    { key: 'disease',   label: 'Disease & pest resistance',  color: '#e6772e',
      re: /mildew|downy|powder|virus|red.?blotch|pathogen|disease|insect resist|\bpest\b/i },
    { key: 'phenomics', label: 'Phenomics & morphology',     color: '#31a354',
      re: /\bleaf\b|leaves|morpholog|leaf shape|phenotyp|phenomic|landmark|root system|canopy/i },
    { key: 'other',     label: 'Other physiology',           color: '#8a94a6', re: null }
  ];
  function themeOf(title) {
    var t = title || '';
    for (var i = 0; i < THEMES.length; i++) {
      if (!THEMES[i].re) return THEMES[i];
      if (THEMES[i].re.test(t)) return THEMES[i];
    }
    return THEMES[THEMES.length - 1];
  }

  // ---- author normalization: first-initial + surname, diacritics stripped ----
  function normAuthor(a) {
    var s = (a || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/[^a-z\s\-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return '';
    var parts = s.split(' ');
    if (parts.length === 1) return parts[0];
    return parts[0].charAt(0) + '|' + parts[parts.length - 1];
  }
  var LONDO = 'j|londo';

  function cleanTitle(t) {
    return (t || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  }
  function isPreprint(c) {
    var id = (c.id || '').toLowerCase(), pub = (c.publisher || '').toLowerCase();
    return id.indexOf('10.1101') > -1 || /rxiv|ssrn|authorea|preprint|gigabyte/.test(pub) ||
           id.indexOf('gigabyte') > -1;
  }
  function year(c) { return (c.date || '').slice(0, 4); }

  // ---- build nodes ----
  var nodes = raw.map(function (c, i) {
    var title = cleanTitle(c.title) || '[untitled]';
    var th = themeOf(title);
    var authors = (c.authors || []).map(function (a) { return a; });
    var norm = {};
    authors.forEach(function (a) { var k = normAuthor(a); if (k && k !== LONDO) norm[k] = 1; });
    return {
      i: i, id: c.id, title: title, authors: authors,
      publisher: c.publisher || '', year: year(c), link: c.link || (c.id ? ('https://doi.org/' + c.id.replace(/^doi:/, '')) : ''),
      theme: th, preprint: isPreprint(c), coauth: Object.keys(norm),
      r: Math.max(6, Math.min(20, 6 + Math.sqrt(Math.max(1, authors.length)) * 1.6)),
      x: 480 + (Math.cos(i) * 180) + (i % 7) * 3, y: 280 + (Math.sin(i * 1.3) * 150) + (i % 5) * 3,
      vx: 0, vy: 0, fx: null, fy: null
    };
  });

  // ---- build edges (shared non-Londo author) ----
  var edges = [], adj = {};
  for (var a = 0; a < nodes.length; a++) {
    for (var b = a + 1; b < nodes.length; b++) {
      var A = nodes[a].coauth, setB = nodes[b].coauth, w = 0;
      for (var k = 0; k < A.length; k++) if (setB.indexOf(A[k]) > -1) w++;
      if (w > 0) {
        edges.push({ s: a, t: b, w: w });
        (adj[a] = adj[a] || {})[b] = 1; (adj[b] = adj[b] || {})[a] = 1;
      }
    }
  }

  // ---- SVG setup ----
  var W = 960, H = 560, cx = W / 2, cy = H / 2;
  var svg = document.getElementById('pubnet-svg');
  var gE = document.getElementById('pubnet-edges');
  var gN = document.getElementById('pubnet-nodes');
  var tip = document.getElementById('pubnet-tip');
  var SVGNS = 'http://www.w3.org/2000/svg';

  var edgeEls = edges.map(function (e) {
    var ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('stroke-width', Math.min(3, e.w));
    ln.setAttribute('stroke-opacity', 0.35);
    gE.appendChild(ln); return ln;
  });

  var nodeEls = nodes.map(function (n) {
    var el;
    if (n.preprint) {
      el = document.createElementNS(SVGNS, 'polygon'); // diamond
    } else {
      el = document.createElementNS(SVGNS, 'circle');
    }
    el.setAttribute('fill', n.theme.color);
    el.setAttribute('stroke', '#ffffff');
    el.setAttribute('stroke-width', 1.5);
    el.setAttribute('cursor', 'pointer');
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'link');
    el.setAttribute('aria-label', n.title);
    gN.appendChild(el);

    el.addEventListener('mouseenter', function (ev) { hoverOn(n.i); showTip(n, ev); });
    el.addEventListener('mousemove', function (ev) { moveTip(ev); });
    el.addEventListener('mouseleave', function () { hoverOff(); hideTip(); });
    el.addEventListener('click', function () { if (n.link) window.open(n.link, '_blank', 'noopener'); });
    el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && n.link) window.open(n.link, '_blank', 'noopener'); });
    el.addEventListener('mousedown', function (ev) { startDrag(n, ev); });
    return el;
  });

  function drawNode(n, el) {
    if (n.preprint) {
      var r = n.r;
      var pts = [ [n.x, n.y - r], [n.x + r, n.y], [n.x, n.y + r], [n.x - r, n.y] ]
        .map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      el.setAttribute('points', pts);
    } else {
      el.setAttribute('cx', n.x.toFixed(1));
      el.setAttribute('cy', n.y.toFixed(1));
      el.setAttribute('r', n.r);
    }
  }

  // ---- force simulation ----
  var alpha = 1, REST = 62, K_SPRING = 0.045, K_REPEL = 2600, K_CENTER = 0.015, FRICTION = 0.86;
  function tick() {
    // repulsion (O(n^2), n=70 -> fine)
    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var A = nodes[i], B = nodes[j];
        var dx = A.x - B.x, dy = A.y - B.y, d2 = dx * dx + dy * dy || 0.01;
        var d = Math.sqrt(d2);
        var f = (K_REPEL / d2) * alpha;
        var fx = (dx / d) * f, fy = (dy / d) * f;
        A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
      }
    }
    // springs
    for (var e = 0; e < edges.length; e++) {
      var s = nodes[edges[e].s], t = nodes[edges[e].t];
      var dx2 = t.x - s.x, dy2 = t.y - s.y, dd = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 0.01;
      var force = K_SPRING * (dd - REST) * alpha;
      var ux = dx2 / dd, uy = dy2 / dd;
      s.vx += ux * force; s.vy += uy * force; t.vx -= ux * force; t.vy -= uy * force;
    }
    // gravity to center + integrate
    for (var n2 = 0; n2 < nodes.length; n2++) {
      var N = nodes[n2];
      N.vx += (cx - N.x) * K_CENTER * alpha;
      N.vy += (cy - N.y) * K_CENTER * alpha;
      if (N.fx != null) { N.x = N.fx; N.y = N.fy; N.vx = 0; N.vy = 0; }
      else {
        N.vx *= FRICTION; N.vy *= FRICTION;
        N.x += N.vx; N.y += N.vy;
        N.x = Math.max(N.r + 2, Math.min(W - N.r - 2, N.x));
        N.y = Math.max(N.r + 2, Math.min(H - N.r - 2, N.y));
      }
    }
    // recenter centroid to canvas middle (keeps the graph framed), unless dragging
    if (!drag) {
      var mx = 0, my = 0;
      for (var m = 0; m < nodes.length; m++) { mx += nodes[m].x; my += nodes[m].y; }
      mx = cx - mx / nodes.length; my = cy - my / nodes.length;
      for (var s2 = 0; s2 < nodes.length; s2++) { nodes[s2].x += mx; nodes[s2].y += my; }
    }
  }
  function render() {
    for (var e = 0; e < edges.length; e++) {
      var s = nodes[edges[e].s], t = nodes[edges[e].t], ln = edgeEls[e];
      ln.setAttribute('x1', s.x.toFixed(1)); ln.setAttribute('y1', s.y.toFixed(1));
      ln.setAttribute('x2', t.x.toFixed(1)); ln.setAttribute('y2', t.y.toFixed(1));
    }
    for (var i = 0; i < nodes.length; i++) drawNode(nodes[i], nodeEls[i]);
  }
  var running = true;
  function loop() {
    if (alpha > 0.005) { tick(); alpha *= 0.985; }
    render();
    if (running) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- hover highlight ----
  function hoverOn(idx) {
    for (var i = 0; i < nodes.length; i++) {
      var on = (i === idx) || (adj[idx] && adj[idx][i]);
      nodeEls[i].setAttribute('opacity', on ? 1 : 0.15);
    }
    for (var e = 0; e < edges.length; e++) {
      var inc = edges[e].s === idx || edges[e].t === idx;
      edgeEls[e].setAttribute('stroke-opacity', inc ? 0.9 : 0.05);
      edgeEls[e].setAttribute('stroke', inc ? '#64748b' : '#cbd5e1');
    }
  }
  function hoverOff() {
    for (var i = 0; i < nodes.length; i++) nodeEls[i].setAttribute('opacity', 1);
    for (var e = 0; e < edges.length; e++) { edgeEls[e].setAttribute('stroke-opacity', 0.35); edgeEls[e].setAttribute('stroke', '#cbd5e1'); }
  }

  // ---- tooltip ----
  function showTip(n, ev) {
    var a = n.authors.slice(0, 4).join(', ') + (n.authors.length > 4 ? ', et al.' : '');
    tip.innerHTML = '<b>' + esc(n.title) + '</b><br>' + esc(a) +
      '<br><span class="pubnet-tip-meta">' + esc(n.publisher) + (n.year ? ' · ' + n.year : '') +
      (n.preprint ? ' · preprint' : '') + '</span>';
    tip.hidden = false; moveTip(ev);
  }
  function moveTip(ev) {
    var box = document.querySelector('.pubnet-canvas').getBoundingClientRect();
    var x = ev.clientX - box.left + 14, y = ev.clientY - box.top + 14;
    if (x + 260 > box.width) x = box.width - 260;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function esc(s) { return (s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---- drag ----
  var drag = null;
  function startDrag(n, ev) {
    ev.preventDefault(); drag = n; n.fx = n.x; n.fy = n.y; alpha = Math.max(alpha, 0.4);
    window.addEventListener('mousemove', onDrag); window.addEventListener('mouseup', endDrag);
  }
  function onDrag(ev) {
    if (!drag) return;
    var box = svg.getBoundingClientRect();
    drag.fx = (ev.clientX - box.left) / box.width * W;
    drag.fy = (ev.clientY - box.top) / box.height * H;
    alpha = Math.max(alpha, 0.25);
  }
  function endDrag() {
    if (drag) { drag.fx = null; drag.fy = null; drag = null; }
    window.removeEventListener('mousemove', onDrag); window.removeEventListener('mouseup', endDrag);
  }

  // ---- legend ----
  var legend = document.getElementById('pubnet-legend');
  THEMES.forEach(function (t) {
    var span = document.createElement('span');
    span.className = 'pubnet-legend-item';
    span.innerHTML = '<span class="pubnet-dot" style="background:' + t.color + '"></span>' + t.label;
    legend.appendChild(span);
  });
  var shape = document.createElement('span');
  shape.className = 'pubnet-legend-item pubnet-legend-shape';
  shape.innerHTML = '<span class="pubnet-dot" style="background:#8a94a6"></span>journal' +
    '<span class="pubnet-dia" style="background:#8a94a6"></span>preprint';
  legend.appendChild(shape);
})();
</script>
