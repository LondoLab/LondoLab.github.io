{% assign pubs = site.data.publications %}
<div class="pub-list{% if include.style == 'grid' %} pub-grid{% endif %}">
  {% for p in pubs %}
    <div class="pub{% if p.lead %} pub-lead{% endif %}">
      {% if p.pdf %}{% assign plink = p.pdf | relative_url %}{% else %}{% assign plink = p.doi %}{% endif %}
      <a
        class="pub-thumb"
        {% if plink %}href="{{ plink }}"{% endif %}
        data-tooltip="{% if p.pdf %}Open the PDF{% else %}View at publisher{% endif %}"
        aria-label="publication link"
      >
        {% if p.thumb %}
          <img src="{{ p.thumb | relative_url }}" alt="First page" loading="lazy">
        {% else %}
          <span class="pub-noimg">PDF</span>
        {% endif %}
      </a>
      <div class="pub-cite">{{ p.citation }}</div>
    </div>
  {% endfor %}
</div>
