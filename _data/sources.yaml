# Manual / supplemental publication entries.
#
# Most lab publications are auto-pulled from ORCIDs listed in _data/orcid.yaml
# by the nightly update-citations workflow (Manubot).
#
# Add an entry here ONLY when you want to:
#   - include a paper that isn't on a listed ORCID
#   - override the auto-generated thumbnail or description for a specific DOI
#   - add tags or a button (Manubot link, source link, etc.) to a paper
#
# Schema (each item):
#   - id: doi:10.xxxx/yyyy           # required for papers
#     type: paper                    # paper | preprint | book | article
#     description: short summary
#     image: https://...             # optional override thumbnail
#     buttons:
#       - type: source
#         link: https://github.com/...
#     tags:
#       - cold-hardiness

