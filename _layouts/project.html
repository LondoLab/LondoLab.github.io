---
layout: default
---

{% if page.hero %}
<figure class="project-hero">
  <img src="{{ page.hero | relative_url }}" alt="{{ page.hero_alt | default: page.title }}" loading="eager">
  {% if page.hero_caption %}<figcaption>{{ page.hero_caption }}</figcaption>{% endif %}
</figure>
{% endif %}

<h1 class="project-page-title">{% if page.icon %}{% include icon.html icon=page.icon %}{% endif %}{{ page.title }}</h1>

{% if page.lead %}
<p class="project-lead">{{ page.lead }}</p>
{% endif %}

{{ content }}

<p class="project-back">
  <a href="{{ '/projects/' | relative_url }}">{% include icon.html icon="fa-solid fa-arrow-left" %}Back to Research</a>
</p>
